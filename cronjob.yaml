apiVersion: batch/v1
kind: CronJob
metadata:
  name: monitor
  namespace: turbomonitor
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 90
      template:
        spec:
          imagePullSecrets:
          - name: tivolinick-pull-secret
          containers:
          - name: turbomonitor
            image: quay.io/tivolinick/turbomonitor:0.1
            imagePullPolicy: Always
            command:
            - /scripts/runmonitor.sh
            volumeMounts:
            - mountPath: /kubeconfig
              name: kubeconfig
            - mountPath: /config/turbocreds
              name: turbocreds
            - mountPath: /config/monitorconfig
              name: monitorconfig
            - mountPath: /config/smtp
              name: turbonomic
          volumes:
          - name: kubeconfig
            secret:
              secretName: kube-secret
          - name: kubeconfig
            secret:
              secretName: kube-secret
          - name: turbocreds
            secret:
              secretName: turbo-creds
          - name: monitorconfig
            configMap:
              name: monitor-config
          - name: kubeconfig
              secret:
                secretName: smtp
          restartPolicy: OnFailure
